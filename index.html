<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>MicroPlayer — Zones d’action</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#111;color:#eee}header{padding:10px;display:flex;gap:7px;flex-wrap:wrap;align-items:center;background:#1c1c1e;position:sticky;top:0;z-index:5}button,label,.pill{background:#2c2c2e;border:1px solid #555;color:#fff;border-radius:10px;padding:8px 11px;font-size:14px}button.active{outline:2px solid #fff}input[type=file]{display:none}input[type=range]{width:110px}.wrap{height:calc(100vh - 105px);display:grid;place-items:center;overflow:hidden;touch-action:none}.stage{position:relative;transform-origin:center}.stage img{display:block;max-width:94vw;max-height:78vh;user-select:none;-webkit-user-drag:none}.stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.zones{display:flex;gap:5px;flex-wrap:wrap}.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}.z1{background:#ff453a}.z2{background:#0a84ff}.z3{background:#30d158}.z4{background:#ffd60a}.hint{font-size:12px;opacity:.7}</style></head><body><header><label>📷 Charger photo<input id="file" type="file" accept="image/*"></label><div class="zones"><button class="zone active" data-z="0"><i class="sw z1"></i>Zone 1</button><button class="zone" data-z="1"><i class="sw z2"></i>Zone 2</button><button class="zone" data-z="2"><i class="sw z3"></i>Zone 3</button><button class="zone" data-z="3"><i class="sw z4"></i>Zone 4</button></div><button id="paint" class="active">✏️ Pinceau</button><button id="erase">⌫ Gomme</button><span class="pill">Taille <input id="size" type="range" min="2" max="80" value="20"></span><button id="undo">↶ Annuler</button><button id="clear">Effacer zone</button><button id="exportBtn">Exporter PNG</button><span class="hint">Apple Pencil, tactile ou souris • pixels calculés à la résolution originale</span></header><main class="wrap"><div class="stage" id="stage"><img id="img" alt="Charge une photo"><canvas id="cv"></canvas></div></main><script>const C=[[255,69,58],[10,132,255],[48,209,88],[255,214,10]],file=document.querySelector('#file'),img=document.querySelector('#img'),cv=document.querySelector('#cv'),ctx=cv.getContext('2d'),stage=document.querySelector('#stage'),size=document.querySelector('#size'),paint=document.querySelector('#paint'),eraseBtn=document.querySelector('#erase');let z=0,erasing=false,drawing=false,last=null,masks=[],history=[];function setup(){cv.width=img.naturalWidth;cv.height=img.naturalHeight;resizeStage();masks=C.map(()=>new Uint8ClampedArray(cv.width*cv.height));history=[];render()}function resizeStage(){stage.style.width=img.clientWidth+'px';stage.style.height=img.clientHeight+'px'}file.onchange=e=>{let f=e.target.files[0];if(!f)return;img.onload=setup;img.src=URL.createObjectURL(f)};addEventListener('resize',()=>img.src&&resizeStage());document.querySelectorAll('.zone').forEach(b=>b.onclick=()=>{document.querySelectorAll('.zone').forEach(x=>x.classList.remove('active'));b.classList.add('active');z=+b.dataset.z;render()});paint.onclick=()=>{erasing=false;paint.classList.add('active');eraseBtn.classList.remove('active')};eraseBtn.onclick=()=>{erasing=true;eraseBtn.classList.add('active');paint.classList.remove('active')};function pos(e){let r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}}function stamp(x,y,e){let pressure=(e&&e.pointerType==='pen'&&e.pressure)?(.65+.7*e.pressure):1,rad=+size.value*pressure*cv.width/cv.getBoundingClientRect().width,a=masks[z],x0=Math.max(0,Math.floor(x-rad)),x1=Math.min(cv.width-1,Math.ceil(x+rad)),y0=Math.max(0,Math.floor(y-rad)),y1=Math.min(cv.height-1,Math.ceil(y+rad));for(let yy=y0;yy<=y1;yy++)for(let xx=x0;xx<=x1;xx++)if((xx-x)**2+(yy-y)**2<=rad*rad)a[yy*cv.width+xx]=erasing?0:255}function line(a,b,e){let d=Math.hypot(b.x-a.x,b.y-a.y),n=Math.max(1,Math.ceil(d/3));for(let i=0;i<=n;i++)stamp(a.x+(b.x-a.x)*i/n,a.y+(b.y-a.y)*i/n,e)}cv.onpointerdown=e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);history.push({z,data:masks[z].slice()});if(history.length>25)history.shift();drawing=true;last=pos(e);stamp(last.x,last.y,e);render()};cv.onpointermove=e=>{if(!drawing)return;e.preventDefault();let p=pos(e);line(last,p,e);last=p;render()};cv.onpointerup=cv.onpointercancel=()=>{drawing=false;last=null};function render(){ctx.clearRect(0,0,cv.width,cv.height);if(!masks.length)return;let id=ctx.createImageData(cv.width,cv.height);for(let k=0;k<masks.length;k++){let a=masks[k],c=C[k];for(let i=0;i<a.length;i++)if(a[i]){let q=i*4;id.data[q]=c[0];id.data[q+1]=c[1];id.data[q+2]=c[2];id.data[q+3]=100}}ctx.putImageData(id,0,0)}document.querySelector('#undo').onclick=()=>{let h=history.pop();if(h){masks[h.z]=h.data;render()}};document.querySelector('#clear').onclick=()=>{if(!masks.length)return;history.push({z,data:masks[z].slice()});masks[z].fill(0);render()};document.querySelector('#exportBtn').onclick=()=>{if(!masks.length)return;masks.forEach((a,k)=>{let c=document.createElement('canvas');c.width=cv.width;c.height=cv.height;let x=c.getContext('2d'),id=x.createImageData(c.width,c.height);for(let i=0;i<a.length;i++){let q=i*4;id.data[q]=id.data[q+1]=id.data[q+2]=255;id.data[q+3]=a[i]}x.putImageData(id,0,0);c.toBlob(b=>{let u=URL.createObjectURL(b),A=document.createElement('a');A.href=u;A.download='microplayer-zone-'+(k+1)+'.png';A.click();setTimeout(()=>URL.revokeObjectURL(u),1500)},'image/png')})};</script></body></html>
