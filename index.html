<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>MicroPlayer — Masques & actions</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#111;color:#eee}header,.panel{padding:9px;display:flex;gap:7px;flex-wrap:wrap;align-items:center;background:#1c1c1e}header{position:sticky;top:0;z-index:5}button,label,input,select,.pill{background:#2c2c2e;border:1px solid #555;color:#fff;border-radius:9px;padding:8px;font-size:14px}button.active{outline:2px solid white}button.valid{background:#174c2c}.file{display:none}.wrap{height:62vh;display:grid;place-items:center;overflow:hidden;touch-action:none}.stage{position:relative}.stage img{display:block;max-width:95vw;max-height:61vh;user-select:none;-webkit-user-drag:none}.stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}.hint{font-size:12px;opacity:.7}.actions{border-top:1px solid #444}.actionCard{padding:7px;border:1px solid #444;border-radius:9px}.checks label{margin-right:5px;display:inline-block}input[type=checkbox]{accent-color:auto}</style></head><body><header><label>📷 Photo<input id="file" class="file" type="file" accept="image/*"></label><select id="maskSel"></select><input id="maskName" value="PHARES" size="12"><button id="rename">Renommer</button><button id="addMask">+ Masque</button><button id="paint" class="active">✏️ Pinceau</button><button id="erase">⌫ Gomme</button><span class="pill">Taille <input id="size" type="range" min="2" max="80" value="20"></span><button id="undo">↶</button><button id="clear">Effacer</button><button id="validate">✓ Valider la sélection</button></header><main class="wrap"><div class="stage" id="stage"><img id="img" alt="Charge une photo"><canvas id="cv"></canvas></div></main><section class="panel actions"><button id="addAction">+ Action</button><span class="hint">Un même masque peut être coché dans plusieurs actions.</span><div id="actionList" style="width:100%;display:grid;gap:7px"></div><button id="export">Exporter projet JSON + masques PNG</button></section><script>const COLORS=[[255,69,58],[10,132,255],[48,209,88],[255,214,10],[191,90,242],[100,210,255]],file=document.querySelector('#file'),img=document.querySelector('#img'),cv=document.querySelector('#cv'),ctx=cv.getContext('2d'),stage=document.querySelector('#stage'),sel=document.querySelector('#maskSel'),nameEl=document.querySelector('#maskName'),size=document.querySelector('#size');let masks=[],actions=[],z=0,erasing=false,drawing=false,last=null,history=[];function freshMask(name){return{name,validated:false,data:new Uint8ClampedArray(cv.width*cv.height)}}function setup(){cv.width=img.naturalWidth;cv.height=img.naturalHeight;stage.style.width=img.clientWidth+'px';stage.style.height=img.clientHeight+'px';masks=[freshMask('PHARES'),freshMask('GUIDON')];actions=[{name:'Appels de phares',maskIds:[0]},{name:'Guidon + phares',maskIds:[0,1]}];z=0;refreshUI();render()}file.onchange=e=>{let f=e.target.files[0];if(!f)return;img.onload=setup;img.src=URL.createObjectURL(f)};function refreshUI(){sel.innerHTML=masks.map((m,i)=>`<option value="${i}">${m.validated?'✓ ':''}${m.name}</option>`).join('');sel.value=z;if(masks[z])nameEl.value=masks[z].name;document.querySelector('#validate').classList.toggle('valid',!!masks[z]?.validated);drawActions()}sel.onchange=()=>{z=+sel.value;refreshUI();render()};document.querySelector('#rename').onclick=()=>{if(!masks[z])return;masks[z].name=nameEl.value.trim()||masks[z].name;refreshUI()};document.querySelector('#addMask').onclick=()=>{if(!cv.width)return;let n=prompt('Nom du masque','NOUVEAU');if(!n)return;masks.push(freshMask(n));z=masks.length-1;refreshUI();render()};document.querySelector('#paint').onclick=()=>{erasing=false;paint.classList.add('active');erase.classList.remove('active')};document.querySelector('#erase').onclick=()=>{erasing=true;erase.classList.add('active');paint.classList.remove('active')};function pos(e){let r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}}function stamp(x,y,e){let rad=+size.value*(e.pointerType==='pen'&&e.pressure?(.65+.7*e.pressure):1)*cv.width/cv.getBoundingClientRect().width,a=masks[z].data;for(let yy=Math.max(0,~~(y-rad));yy<=Math.min(cv.height-1,Math.ceil(y+rad));yy++)for(let xx=Math.max(0,~~(x-rad));xx<=Math.min(cv.width-1,Math.ceil(x+rad));xx++)if((xx-x)**2+(yy-y)**2<=rad*rad)a[yy*cv.width+xx]=erasing?0:255;masks[z].validated=false}function line(a,b,e){let d=Math.hypot(b.x-a.x,b.y-a.y),n=Math.max(1,Math.ceil(d/3));for(let i=0;i<=n;i++)stamp(a.x+(b.x-a.x)*i/n,a.y+(b.y-a.y)*i/n,e)}cv.onpointerdown=e=>{if(!masks.length)return;e.preventDefault();history.push({z,data:masks[z].data.slice()});drawing=true;last=pos(e);stamp(last.x,last.y,e);render()};cv.onpointermove=e=>{if(!drawing)return;let p=pos(e);line(last,p,e);last=p;render()};cv.onpointerup=cv.onpointercancel=()=>{drawing=false;last=null;refreshUI()};function render(){ctx.clearRect(0,0,cv.width,cv.height);if(!masks.length)return;let id=ctx.createImageData(cv.width,cv.height);masks.forEach((m,k)=>{let c=COLORS[k%COLORS.length];for(let i=0;i<m.data.length;i++)if(m.data[i]){let q=i*4;id.data[q]=c[0];id.data[q+1]=c[1];id.data[q+2]=c[2];id.data[q+3]=m.validated?125:75}});ctx.putImageData(id,0,0)};document.querySelector('#undo').onclick=()=>{let h=history.pop();if(h){masks[h.z].data=h.data;masks[h.z].validated=false;z=h.z;refreshUI();render()}};document.querySelector('#clear').onclick=()=>{if(masks[z]){history.push({z,data:masks[z].data.slice()});masks[z].data.fill(0);masks[z].validated=false;refreshUI();render()}};document.querySelector('#validate').onclick=()=>{if(!masks[z])return;masks[z].validated=true;refreshUI();render()};function drawActions(){let box=document.querySelector('#actionList');box.innerHTML='';actions.forEach((a,ai)=>{let d=document.createElement('div');d.className='actionCard';d.innerHTML=`<input class="an" data-a="${ai}" value="${a.name}"> <span class="checks">${masks.map((m,mi)=>`<label><input type="checkbox" data-a="${ai}" data-m="${mi}" ${a.maskIds.includes(mi)?'checked':''}>${m.name}</label>`).join('')}</span>`;box.appendChild(d)});box.querySelectorAll('.an').forEach(x=>x.onchange=()=>actions[+x.dataset.a].name=x.value);box.querySelectorAll('input[type=checkbox]').forEach(x=>x.onchange=()=>{let a=actions[+x.dataset.a],m=+x.dataset.m;a.maskIds=x.checked?[...new Set([...a.maskIds,m])]:a.maskIds.filter(v=>v!==m)})}document.querySelector('#addAction').onclick=()=>{actions.push({name:'Nouvelle action',maskIds:[]});drawActions()};function dl(blob,n){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}document.querySelector('#export').onclick=()=>{let meta={version:2,width:cv.width,height:cv.height,masks:masks.map((m,i)=>({id:i,name:m.name,validated:m.validated,file:`mask-${i+1}-${m.name}.png`})),actions};dl(new Blob([JSON.stringify(meta,null,2)],{type:'application/json'}),'microplayer-actions.json');masks.forEach((m,k)=>{let c=document.createElement('canvas');c.width=cv.width;c.height=cv.height;let x=c.getContext('2d'),id=x.createImageData(c.width,c.height);for(let i=0;i<m.data.length;i++){let q=i*4;id.data[q]=id.data[q+1]=id.data[q+2]=255;id.data[q+3]=m.data[i]}x.putImageData(id,0,0);c.toBlob(b=>dl(b,`mask-${k+1}-${m.name}.png`),'image/png')})};</script></body></html>
